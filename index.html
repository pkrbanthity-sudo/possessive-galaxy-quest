{e:'👩‍🏫',s:'Ms. Kim loves ___ job. She is a teacher.',a:'her',o:['his','her','their','its'],w:'Ms. Kim is a woman → her.'},
{e:'⚽',s:'Max plays football with ___ friends.',a:'his',o:['her','my','his','our'],w:'Max is a boy → his.'},
{e:'🏠',s:'We have a house. ___ house is old.',a:'our',o:['my','our','their','its'],w:'"We" → our.'},
{e:'✏️',s:'Is this ___ pencil, Sara? Yes, it is mine.',a:'your',o:['my','her','your','our'],w:'We talk to Sara ("you") → your.'},
{e:'🚙',s:'Mr. and Mrs. Lee have a car. ___ car is fast.',a:'their',o:['his','our','their','her'],w:'Mr. and Mrs. Lee = they → their.'},
{e:'🐱',s:'Look at the cat! ___ eyes are green.',a:'its',o:['his','her','its','their'],w:'A cat here is an animal → its.'},
{e:'🎒',s:'Ben and I are classmates. ___ teacher is kind.',a:'our',o:['their','our','my','your'],w:'Ben and I = we → our.'},
{e:'🍳',s:'Dad and Mom are in the kitchen. They cook ___ favorite food.',a:'their',o:['our','his','their','her'],w:'Dad and Mom = they → their.'},
{e:'📚',s:'Tom and Ann, please open ___ books on page 5.',a:'your',o:['our','their','your','its'],w:'We talk to Tom and Ann ("you") → your.'}]},
{name:'Pronunciation Probe',emoji:'🔮',g:'#a78bfa',c:'radial-gradient(circle at 35% 30%,#ddd6fe,#7c3aed 60%,#2e1065)',intro:'Tap 🔊 to listen, then pick the missing word. Or tap 🎤 and say the whole sentence!',qs:[
{e:'📓',s:'This is ___ notebook.',a:'my',say:'This is my notebook.',o:['my','your','his'],w:'You heard "my". The notebook is mine!'},
{e:'🐕',s:'She loves ___ dog.',a:'her',say:'She loves her dog.',o:['his','her','their'],w:'"She" → her.'},
{e:'🧹',s:'They clean ___ room.',a:'their',say:'They clean their room.',o:['our','their','its'],w:'"They" → their. It sounds like "thair".'},
{e:'🏫',s:'We love ___ school.',a:'our',say:'We love our school.',o:['my','our','your'],w:'"We" → our. It sounds like "ow-er".'},
{e:'🤖',s:'The robot has ___ own light.',a:'its',say:'The robot has its own light.',o:['his','its','her'],w:'A robot is a thing → its.'},
{e:'👟',s:'I like ___ new shoes.',a:'your',say:'I like your new shoes.',o:['my','your','our','their'],w:'You heard "your" → the shoes belong to you.'},
{e:'🎸',s:'___ brother plays the guitar.',a:'his',say:'His brother plays the guitar.',o:['her','his','their','my'],w:'You heard "his" → the brother of a boy.'},
{e:'📝',s:'___ teacher gives us homework every day.',a:'our',say:'Our teacher gives us homework every day.',o:['your','our','their','my'],w:'You heard "our" → the teacher of us.'},
{e:'🐶',s:'The dog wags ___ tail when it is happy.',a:'its',say:'The dog wags its tail when it is happy.',o:['his','its','her','their'],w:'A dog here is an animal → its.'},
{e:'🧺',s:'Anna and Ben bring ___ lunch to the park.',a:'their',say:'Anna and Ben bring their lunch to the park.',o:['her','our','their','its'],w:'Anna and Ben = they → their.'}]}];

const GOOD=['A chain broke! 🔓','The rope pulled Mimi up! ⬆️','A rock rolled away! 🪨'],BADM=['The chains got tighter! 😱','The rope dropped lower! The crocodile is closer! 🐊','More rocks fell on Mimi! 🪨'],OM=['The candle blew out... Mimi was swept away by the mist. 💨','SNAP! The crocodile got too close and the lights went out... 🐊','CRASH! The rocks piled up and the cave went dark... 🪨'];
const RANKS=[[27,'Legendary Ghost Hunter 👑'],[22,'Brave Ghost Hunter 🌟'],[16,'Spooky Explorer 🔦'],[0,'Little Pumpkin 🎃']];
const CHEER=['Great job, hunter! 🌟','Mimi is smiling! 👻','Spooktacular! 🎃','You are a star! ⭐','Brilliant! 🔦'];
const TRY=["Don't give up, hunter! 💪","Oops! Brave hunters keep trying! 🔦","So close! You can do the next one! 🌠"];
const $=document.getElementById('app'),g$=id=>document.getElementById(id);
let stg,qi,score,W,D,done,CAP=false,tm,dl,alarm,PD=0;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function L(w,c){return c?w[0].toUpperCase()+w.slice(1):w}
// ===== Mimi the ghost (3D) =====
function boo(d,f){const fc=['😄','🙂','🙂','😟','😨','😱'];let ch='';for(let i=0;i<d;i++)ch+=`<i class="chain" style="top:${42+i*23}px"></i>`;
 return `<div class="sway"><div class="b3d"><div class="bw" style="transform:scaleX(${1-d*.03})"><div class="girl ${f||''}"><i class="cb"></i><i class="cl l1"></i><i class="cl l2"></i><i class="dr"></i><i class="cs"></i><i class="lg l1"></i><i class="lg l2"></i><i class="pt a"></i><i class="pt b"></i><span class="gf">${f=='gone'?'💨':fc[Math.min(d,5)]}</span><i class="hr"></i></div>${ch}</div></div></div>`}
const ROCK=[[0,0,92,-8],[118,0,86,10],[58,46,90,5],[14,98,70,-12],[110,94,68,14]];
function scene(d,f){if(stg==0)return boo(d,f);
 const fc=['😄','🙂','🙂','😟','😨','😱'],face=f=='gone'?'💨':fc[Math.min(d,5)];
 const G=`<div class="b3d"><div class="bw"><div class="girl stand ${f||''}"><i class="dr"></i><i class="lg l1"></i><i class="lg l2"></i><i class="pt a"></i><i class="pt b"></i><span class="gf">${face}</span><i class="hr"></i></div></div></div>`;
 if(stg==1){const t=d*18,p=PD*18;return `<div class="beam"></div><div class="rp" style="height:${t+84}px;--ph:${p+84}px"></div><div class="hg" style="top:${t+14}px;--p:${p+14}px">${G}</div><div class="croc ${d>=4?'snap':''}" style="--o:${8+d*7}deg"><i class="cbd"></i><i class="cu"></i><i class="cd"></i><i class="ce"></i></div><div class="water"></div>`}
 let r='';const n=Math.max(d,PD);for(let i=0;i<n;i++){const P=ROCK[i];r+=`<i class="rk ${i>=d?'rm':i>=PD?'new':''}" style="left:${P[0]}px;bottom:${P[1]}px;width:${P[2]}px;height:${P[2]*.9}px;--r:${P[3]}deg"></i>`}
 return `<div class="hg g2">${G}</div>${r}<div class="dust"></div>`}
function side(){let p='';for(let i=0;i<5;i++)p+=i<W?'💀':'🕯️';
 return `<div class="cage sc${stg}">${scene(D)}</div><div class="pips">${p}<small>Mistakes: ${Math.min(W,5)}/5 • Danger: ${D}</small></div>`}
// ===== Timer =====
function clearT(){clearInterval(tm);clearInterval(sir);document.body.classList.remove('warn');const a=g$('al');if(a)a.remove()}
function startT(){dl=Date.now()+10000;alarm=false;tm=setInterval(()=>{const r=Math.max(0,dl-Date.now())/1000;g$('tb').style.width=r*10+'%';g$('tn').textContent=Math.ceil(r);
 if(r<=4&&r>0&&!alarm){alarm=true;document.body.classList.add('warn');const a=document.createElement('div');a.id='al';a.innerHTML='<span>🚨</span><b>HURRY!</b>';document.body.appendChild(a);siren();thump();sir=setInterval(()=>{siren();thump()},700)}
 if(r<=0){ans('')}},100)}
// ===== Screens =====
function home(){clearT();stg=qi=score=W=0;D=3;PD=3;$.innerHTML=`<h1>Possessive Galaxy Quest</h1><p style="font-family:Creepster;font-size:30px;color:var(--gold)">Haunted Edition 🎃</p>
<div class="cage">${boo(3)}</div>
<div class="card"><p>👻 <b>Mimi</b> is trapped in the haunted cage! Answer each question in <b>10 seconds</b>.</p>
<p class="small" style="margin-top:8px">✅ Right answer = a chain breaks &nbsp; ❌ Wrong answer = chains get tighter<br>💀 More than 5 mistakes and the mist takes Mimi away!</p></div>
<button class="btn" onclick="A();startAmb();intro()">🔦 Start Mission</button>`}
function intro(){clearT();const S=STAGES[stg];$.innerHTML=`<p class="small">Room ${stg+1} of 3 • Mistakes ${W}/5</p><div class="planet ${S.ring?'':'noring'}" style="--g:${S.g};background:${S.c}"></div>
<h2>Welcome to ${S.name}!</h2><div class="card"><p>${S.intro}</p>${["","<p style=\"margin-top:8px\">🐊 Mimi is hanging over a hungry crocodile! Right = the rope pulls her up. Wrong = the rope drops lower!</p>","<p style=\"margin-top:8px\">🪨 The cave is collapsing! Right = a rock rolls away. Wrong = more rocks fall on Mimi!</p>"][stg]}<p class="small" style="margin-top:8px">⏱️ You have 10 seconds for each question.</p>${stg==0?'<p class="small" style="margin-top:8px">Remember: I→my • you→your • he→his • she→her • it→its • we→our • they→their</p>':''}</div>
<button class="btn" onclick="qi=0;ques()">Let's go! 🔦</button>`}
function hud(){const pos=(stg+qi/10)/3*92+4;let n='';[...STAGES.map(s=>s.emoji),'🌌'].forEach((e,i)=>n+=`<span class="node ${i<=stg?'on':''}" style="left:${4+i*30.67}%">${e}</span>`);
 return `<div class="hud"><span>${STAGES[stg].name}</span><span>Q ${qi+1}/10</span><span>⭐ ${score}</span></div><div class="track">${n}<span class="rocket" style="left:${pos}%">🔦</span></div>`}
function ques(){done=false;clearT();const S=STAGES[stg],q=S.qs[qi],opts=q.o||ALL;const cap=/(^|[.!?]\s)___/.test(q.s);CAP=cap;PD=D;
 const sent=q.s.replace('___','<span class="blank" id="bl">&nbsp;&nbsp;&nbsp;</span>');const mic=(window.SpeechRecognition||window.webkitSpeechRecognition)&&stg==2;
 $.innerHTML=hud()+`<div class="play"><div id="side">${side()}</div><div class="main"><div class="timer"><div id="tb"></div><span id="tn">10</span></div>
 <div class="card"><div class="emo">${q.e}</div><div class="sent" style="margin:8px 0">${sent}</div>
 ${stg==2?`<div class="row" style="margin-bottom:12px"><button class="btn mic" onclick="say(STAGES[2].qs[${qi}].say)">🔊 Listen</button>${mic?'<button class="btn mic" onclick="listen()">🎤 Say it</button>':''}</div>`:''}
 ${stg==0?'<p class="small" style="margin-bottom:8px">📦 Word Bank</p>':''}
 <div class="opts">${opts.map(o=>`<button class="opt" onclick="ans('${o}',this)">${L(o,cap)}</button>`).join('')}</div></div><div id="fb"></div></div></div>`;
 startT();if(stg==2)setTimeout(()=>say(q.say),500)}
function ans(w,btn){if(done)return;done=true;clearT();const q=STAGES[stg].qs[qi],ok=w==q.a,to=w==='',bl=g$('bl');
 bl.textContent=L(q.a,CAP);bl.className='blank '+(ok?'ok':'bad');if(btn)btn.classList.add(ok?'ok':'bad');
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent.toLowerCase()==q.a)b.classList.add('ok')});
 PD=D;if(ok){score++;D=Math.max(0,D-1);good()}else{W++;D=Math.min(5,D+1);bad()}fx(ok);
 const sd=g$('side');sd.innerHTML=side();if(!ok){sd.classList.add('shake')}
 const gone=W>5;
 g$('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'✅ Correct! '+pick(CHEER)+' '+GOOD[stg]:(to?'⏰ Time is up! ':'')+'❌ The answer is "'+L(q.a,CAP)+'". '+(gone?'Oh no...':pick(TRY)+' '+BADM[stg])}</b><br>💡 ${q.w}</div>
 <button class="btn" style="margin-top:14px" onclick="${gone?'over()':'next()'}">${gone?'Oh no... 💨':qi==9&&stg==2?'See my results 🌌':qi==9?'Go to the next room 🚪':'Next ➜'}</button>`;
 g$('fb').scrollIntoView({behavior:'smooth',block:'end'})}
function next(){if(qi<9){qi++;ques()}else if(stg<2){stg++;D=2;travel()}else end()}
function travel(){clearT();const m=stg==1?'Mimi breaks free and runs out of the cage! 🏃‍♀️':'Mimi escapes the swamp and runs into a dark cave! 🏃‍♀️';
 $.innerHTML=hud()+`<div class="runbox"><div class="rn"><div class="girl stand run"><i class="dr"></i><i class="lg l1"></i><i class="lg l2"></i><i class="pt a"></i><i class="pt b"></i><span class="gf">😰</span><i class="hr"></i></div></div></div><h2>${m}</h2><p>Score so far: ⭐ ${score}</p>`;
 for(let i=0;i<6;i++)setTimeout(()=>beep(80,.08,'square',.1),300+i*300);setTimeout(intro,2400)}
function over(){clearT();dead();$.innerHTML=`<div class="cage sc${stg}">${scene(5,'gone')}</div><h1>Game Over</h1><div class="card"><p>${OM[stg]}</p><p style="margin-top:8px">Too many mistakes this time, but every ghost hunter starts somewhere. Try again, you can do it! 💪</p><p style="margin-top:8px"><b>Score: ⭐ ${score}</b></p></div><button class="btn" onclick="home()">🔄 Restart from the beginning</button>`}
function end(){clearT();const r=RANKS.find(r=>score>=r[0])[1],s=score>=24?3:score>=16?2:1;
 $.innerHTML=`<div class="cage sc${stg}">${scene(0)}</div><h1>Mimi is FREE!</h1><div class="stars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div>
 <div class="card"><h2>${score} / 30 points</h2><p style="margin-top:8px">Your rank: <b style="color:var(--gold)">${r}</b></p><p class="small" style="margin-top:10px">${score>=24?'Amazing! You really know your possessive adjectives!':score>=16?'Great work! Practice a little more to become a Legend!':'Good start, hunter! Try again to collect more stars!'}</p></div>
 <button class="btn" onclick="home()">🔄 Play Again</button>`;good();setTimeout(()=>beep(1040,.3),300)}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||done)return;const r=new SR();r.lang='en-US';
 r.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase(),q=STAGES[2].qs[qi];ans(new RegExp('\\b'+q.a+'\\b').test(t)?q.a:'?',null)};r.onerror=()=>{};r.start()}
home();
</script></body></html>
